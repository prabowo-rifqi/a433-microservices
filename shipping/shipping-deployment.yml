apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping
  template:
    metadata:
      labels:
        app: shipping
    spec:
      containers:
        - name: shipping
          image: ghcr.io/prabowo-rifqi/a433-microservices/shipping-service:latest
          imagePullPolicy: IfNotPresent
          resources: {}
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: AMQP_URL
              value: "amqp://guest:guest@rabbitmq-service.messaging.svc.cluster.local:5672"